<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // One home for the board: tabs live in this browser's storage, which is per-domain.
      if (location.hostname === "www.hackmash.xyz") location.replace("https://hackmash.xyz" + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hackmash: every hackathon, one board</title>
    <meta name="description" content="Every open hackathon from Devpost, Unstop, Devfolio, MLH, HackerEarth, DoraHacks and more on one board. Filter by theme, deadline, prize, mode and place, and track the ones you applied to." />
    <meta name="theme-color" content="#2b1d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Hackmash: every hackathon, one board" />
    <meta property="og:description" content="Every open hackathon from every platform, in one format. Apply on the original site, track it here." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!--
      THESIS: Hackmash is the campus notice board for every hackathon: every platform's notices pinned in one format, deadlines stamped in red. It refuses the white SaaS card grid with a purple accent and the neon "hacker" dashboard.
      OWN-WORLD: flat speckled cork field; photocopy-white and coloured paper stocks (yellow ideathon, blue contest, green data); toner-black condensed Archivo; red rubber stamps for deadlines; blue ballpoint for everything the user does; push pins carry state; perforated tear-off tabs hold the actions; walnut frame header.
      STORY: see every platform on one board, narrow it, open a notice, tear a tab to apply or keep it in My tabs, where deadlines and clashes are tracked.
      FIRST VIEWPORT: walnut frame with a pinned wordmark label and nav; full-width paper search strip; pinned quick-filter slips; notebook-page filters left; 3-4 column notice grid right, closing soonest first.
      FORM: campus notice board, 5 of 7, seed e24e9511.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <noscript>Hackmash needs JavaScript to filter the board. The raw data is at <a href="/api/hackathons">/api/hackathons</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
